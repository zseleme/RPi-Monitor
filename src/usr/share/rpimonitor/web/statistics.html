<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPi Statistics</title>
  <link rel="icon" href="img/favicon.png">
  <script>
    tailwind = { config: {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter','system-ui','-apple-system','sans-serif'],
            mono: ['"JetBrains Mono"','"Fira Code"','monospace']
          }
        }
      }
    }};
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Chart.js + Luxon time adapter -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1/dist/chartjs-adapter-luxon.umd.min.js"></script>
  <!-- RRD reader (from local server) -->
  <script src="js/javascriptrrd/binaryXHR.js"></script>
  <script src="js/javascriptrrd/rrdFile.js"></script>
  <style>
    .card { transition: box-shadow 0.2s ease; }
    .card:hover { box-shadow: 0 0 0 1px rgba(148,163,184,.12), 0 8px 32px rgba(0,0,0,.4); }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9px; }
    .metric-btn.active { background: #1e3a5f !important; border-color: #3b82f6 !important; color: #93c5fd !important; }
    .rra-btn.active    { background: #0f2942 !important; border-color: #38bdf8 !important; color: #38bdf8 !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen antialiased">

  <!-- ── Header ─────────────────────────────────────────────── -->
  <header class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur border-b border-slate-800/60">
    <div class="max-w-7xl mx-auto px-5 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-violet-500 to-purple-600 flex items-center justify-center shadow-lg shadow-violet-500/20">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
              d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-sm font-bold text-white leading-tight" id="hostname">DietPi</h1>
          <p class="text-xs text-slate-500 leading-tight">Statistics</p>
        </div>
      </div>
      <nav class="hidden md:flex items-center gap-1 text-xs font-medium">
        <a href="dashboard.html" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition-colors">Dashboard</a>
        <span class="px-3 py-1.5 rounded-md bg-slate-800 text-slate-200">Statistics</span>
      </nav>
      <div class="flex items-center gap-1.5 bg-violet-950/60 border border-violet-900/50 rounded-full px-2.5 py-1">
        <span class="w-1.5 h-1.5 rounded-full bg-violet-400"></span>
        <span class="text-xs font-medium text-violet-400">Historical</span>
      </div>
    </div>
  </header>

  <!-- ── Layout ─────────────────────────────────────────────── -->
  <div class="max-w-7xl mx-auto px-5 py-5 flex gap-4">

    <!-- Sidebar -->
    <aside class="w-48 flex-shrink-0 hidden md:block">
      <p class="text-xs font-semibold text-slate-600 uppercase tracking-widest mb-3 px-1">Metrics</p>
      <div class="space-y-1" id="metric-list"></div>
    </aside>

    <!-- Main -->
    <main class="flex-1 min-w-0 space-y-4">

      <!-- Mobile metric picker -->
      <div class="md:hidden overflow-x-auto">
        <div class="flex gap-2 pb-1" id="metric-list-mobile"></div>
      </div>

      <!-- Chart card -->
      <div class="card bg-slate-900 rounded-2xl border border-slate-800/80 p-5">
        <!-- Title + RRA buttons -->
        <div class="flex flex-wrap items-start justify-between gap-3 mb-5">
          <div>
            <h2 class="text-base font-semibold text-white" id="chart-title">Select a metric</h2>
            <p class="text-xs text-slate-500 mt-0.5" id="chart-subtitle">—</p>
          </div>
          <div class="flex gap-1.5 flex-wrap" id="rra-buttons"></div>
        </div>

        <!-- Loading -->
        <div id="loading" class="hidden">
          <div class="flex flex-col items-center justify-center py-20 gap-3">
            <div class="w-8 h-8 border-2 border-violet-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-xs text-slate-500">Loading data…</p>
          </div>
        </div>

        <!-- Error -->
        <div id="error-state" class="hidden">
          <div class="flex items-center justify-center py-20">
            <p class="text-sm text-red-400" id="error-msg">Failed to load data.</p>
          </div>
        </div>

        <!-- Chart canvas -->
        <div id="chart-wrapper" class="relative" style="height:380px">
          <canvas id="chart"></canvas>
        </div>
      </div>

      <!-- Stats summary -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="stats-row"></div>

    </main>
  </div>

  <!-- ── Footer ─────────────────────────────────────────────── -->
  <footer class="border-t border-slate-800/60 mt-4 py-3 text-center">
    <p class="text-xs text-slate-600">
      <a href="https://github.com/zseleme/RPi-Monitor" class="hover:text-slate-400 transition-colors">RPi-Monitor</a>
    </p>
  </footer>

  <script src="js/statistics.js"></script>
</body>
</html>
