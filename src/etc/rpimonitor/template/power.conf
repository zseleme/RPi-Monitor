# Power / throttle status
# throttled_raw: full bitmask (dashboard display, no RRD)
# undervoltage_now, power_throttled, power_freqcap: current bits recorded to RRD
# Bits 0-3 reset when condition clears → RRD shows real event spikes over time

dynamic.1.name=throttled_raw
dynamic.1.source=vcgencmd get_throttled 2>/dev/null
dynamic.1.regexp=throttled=(0x[0-9a-fA-F]+)
dynamic.1.postprocess=hex($1)
dynamic.1.default=0

dynamic.2.name=undervoltage_now
dynamic.2.source=cat /sys/class/hwmon/hwmon1/in0_lcrit_alarm 2>/dev/null
dynamic.2.regexp=(\d+)
dynamic.2.postprocess=$1
dynamic.2.default=0
dynamic.2.rrd=GAUGE

dynamic.3.name=power_throttled
dynamic.3.source=vcgencmd get_throttled 2>/dev/null
dynamic.3.regexp=throttled=(0x[0-9a-fA-F]+)
dynamic.3.postprocess=(hex($1) & 0x4) ? 1 : 0
dynamic.3.default=0
dynamic.3.rrd=GAUGE

dynamic.4.name=power_freqcap
dynamic.4.source=vcgencmd get_throttled 2>/dev/null
dynamic.4.regexp=throttled=(0x[0-9a-fA-F]+)
dynamic.4.postprocess=(hex($1) & 0x2) ? 1 : 0
dynamic.4.default=0
dynamic.4.rrd=GAUGE

dynamic.5.name=cpu_voltage
dynamic.5.source=vcgencmd measure_volts core 2>/dev/null
dynamic.5.regexp=volt=([0-9.]+)V
dynamic.5.postprocess=$1
dynamic.5.rrd=GAUGE
