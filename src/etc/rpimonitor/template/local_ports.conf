dynamic.1.name=port_ssh
dynamic.1.source=bash -c "ss -tlnp | grep -q ':2222 ' && echo active || echo inactive"
dynamic.1.regexp=(.*)
dynamic.1.default=inactive

dynamic.2.name=port_rpimonitor
dynamic.2.source=bash -c "ss -tlnp | grep -q ':8888 ' && echo active || echo inactive"
dynamic.2.regexp=(.*)
dynamic.2.default=inactive

dynamic.3.name=port_docker
dynamic.3.source=bash -c "ss -tlnp | grep -q ':2375\|:2376' && echo active || echo inactive"
dynamic.3.regexp=(.*)
dynamic.3.default=inactive

web.status.1.content.3.title="Ports"
web.status.1.content.3.icon=network.png
web.status.1.content.3.line.1=Label(data.port_ssh,"=='active'","SSH :2222","success")+Label(data.port_ssh,"!='active'","SSH :2222","danger")+" "+Label(data.port_rpimonitor,"=='active'","RPiMonitor :8888","success")+Label(data.port_rpimonitor,"!='active'","RPiMonitor :8888","danger")
web.status.1.content.3.line.2=Label(data.port_docker,"=='active'","Docker API :2375","success")+Label(data.port_docker,"!='active'","Docker API :2375","default")
